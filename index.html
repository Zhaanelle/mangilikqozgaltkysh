<!doctype html>

<title>3D Model Lab</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}

#labels{position:absolute;inset:0;pointer-events:none}#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.detail{margin-top:12px;border:1px solid #365162;background:#1c2b39;border-radius:12px;padding:15px;min-height:84px}.detail strong{display:block;margin-bottom:6px}
footer{color:#afc1cc;font-size:.86rem;margin:12px 0}
@media(max-width:600px){main{padding:10px}#stage{height:58vh;min-height:300px}.tag{font-size:10px;padding:3px 5px}}

  const screw=(g,x,y,z)=>{cyl(g,x,y,z,.075,.07,silver);box(g,x,y,z+.045,.075,.012,.012,edge)};
  const frame=new THREE.Group();box(frame,-2.25,-2.38,0,7.15,.32,2.05,dark);box(frame,-4.9,.1,0,.43,4.8,.6,dark);box(frame,.4,.1,0,.43,4.8,.6,dark);box(frame,-2.25,2.43,0,5.75,.32,.62,dark);for(const x of [-4.9,.4]){box(frame,x,-2.06,.1,.75,.13,.79,steel);for(const dx of [-.25,.25]){screw(frame,x+dx,-2.0,.53);screw(frame,x+dx,2.62,.36)}}for(const x of [-5.5,.98])for(const z of [-.72,.72])screw(frame,x,-2.17,z);addPart({name:'Тұғыр мен екі тірек',info:'Білікті және жоғарғы бекіткіштерді ұстайтын болат рама.',group:frame,explode:[0,-.8,-.4],anchor:[-2.1,2.72,.1]});
  const shaft=new THREE.Group(),shaftRotor=new THREE.Group();shaftRotor.position.set(-2.28,.13,.36);cyl(shaftRotor,0,0,0,.16,5.85,steel,'x');for(const x of [-1.37,-.1,1.18])cyl(shaftRotor,x,0,0,.23,.15,silver,'x');shaft.add(shaftRotor);for(const x of [-4.88,.38]){cyl(shaft,x,.13,.36,.35,.37,edge,'x');tor(shaft,x,.13,.36,.22,.06,silver,'x')}addPart({name:'Негізгі білік және мойынтіректер',info:'Білік өзінің көлденең X осін айналады; екі тіректегі мойынтіректер қозғалмайды.',group:shaft,explode:[0,0,1.0],anchor:[-2.7,.45,.5]});
  const fly=new THREE.Group();fly.position.set(-5.95,.13,.36);for(let i=0;i<4;i++)cyl(fly,i*.105,0,0,.7+i*.012,.12,i%2?edge:steel,'x');for(const r of [.27,.47,.61])tor(fly,.49,0,0,r,.035,edge,'x');cyl(fly,.6,0,0,.19,.22,silver,'x');for(let a=0;a<8;a++){const t=a*Math.PI/4;const bolt=new THREE.Mesh(new THREE.SphereGeometry(.04,10,8),silver);bolt.position.set(.64,Math.cos(t)*.35,Math.sin(t)*.35);fly.add(bolt)}addPart({name:'Сол жақтағы жетек шкиві',info:'Білікпен бір осьте айналатын жетек шкиві. Сырттан бастапқы айналу беріледі.',group:fly,explode:[-1.2,0,.2],anchor:[.4,.78,.3]});
  const crank=new THREE.Group();crank.position.set(-2.25,.13,.36);for(const x of [-1.15,.1,1.25]){const s=x>1?-1:1;cyl(crank,x,0,0,.37,.18,steel,'x');cyl(crank,x,0,.12,.26,.18,edge,'x');cyl(crank,x,0,.23,.12,.23,silver,'x');cyl(crank,x,s*.15,s*.34,.13,.16,silver,'x');line(crank,[[x,0,s*.22],[x,s*.15,s*.34]],.075,steel)}addPart({name:'Иінді білік пен үш иін',info:'Барлық иін көлденең біліктің өз осін айналады; шеткі эксцентрлік түйреуіштер қарама-қарсы фазада жоғары-төмен қозғалады.',group:crank,explode:[0,0,1.15],anchor:[0,.62,.3]});
  const makeSpring=(x,top)=>{const g=new THREE.Group();g.position.set(x,top?1.36:-1.2,.68);const coil=new THREE.Group(),moving=new THREE.Group();g.add(coil,moving);const h=.95;const pts=[];for(let i=0;i<=150;i++){const t=i/150;pts.push([Math.cos(t*Math.PI*18)*.17,(t-.5)*h,Math.sin(t*Math.PI*18)*.17])}line(coil,pts,.037,silver);moving.position.y=top?-.55:.55;cyl(moving,0,0,0,.16,.16,steel);tor(moving,0,top?-.045:.045,.04,.14,.035,steel);cyl(g,0,top?.55:-.55,0,.16,.16,steel);tor(g,0,top?.59:-.59,.04,.14,.035,steel);addPart({name:(top?'Жоғарғы':'Төменгі')+' серіппе '+(x< -2?'1':'2'),info:top?'Жоғарғы бекіткіш тұрақты; төменгі ұшы иін қозғалғанда серіппені айқын қысады және созады.':'Төменгі бекіткіш тұрақты; жоғарғы ұшы иінмен бірге қозғалады. Серіппе энергияны уақытша сақтайды.',group:g,explode:[x< -2?-.34:.34,top?.62:-.62,.48],anchor:[0,0,.16]});g.userData.coil=coil;g.userData.moving=moving;g.userData.top=top;return g};
  const springs=[makeSpring(-3.38,true),makeSpring(-1.12,true),makeSpring(-3.38,false),makeSpring(-1.12,false)];
  const right=new THREE.Group();right.position.set(.93,.13,.36);for(let i=0;i<3;i++)cyl(right,i*.14,0,0,.55,.12,i%2?rubber:steel,'x');tor(right,.43,0,0,.52,.05,edge,'x');cyl(right,.5,0,0,.2,.21,silver,'x');addPart({name:'Оң жақтағы шкив',info:'Негізгі білікпен бір осьте айналып, қозғалысты белдікке береді.',group:right,explode:[.75,0,.3],anchor:[.35,.66,.2]});
  const belt=new THREE.Group();const upper=[[1.12,.59,.85],[1.48,.45,.85],[1.84,.29,.85],[2.23,.08,.85],[2.62,-.14,.85]],lower=[[1.12,-.31,.85],[1.49,-.39,.85],[1.88,-.49,.85],[2.27,-.60,.85],[2.62,-.70,.85]];line(belt,upper,.055,rubber);line(belt,lower,.055,rubber);const beltMarkers=[];for(const track of [upper,lower]){const curve=new THREE.CatmullRomCurve3(track.map(p=>new THREE.Vector3(...p)));for(let i=0;i<3;i++){const marker=new THREE.Mesh(new THREE.SphereGeometry(.067,10,8),silver);marker.visible=false;belt.add(marker);beltMarkers.push({marker,curve,index:i,reverse:track===lower})}}addPart({name:'Белдік',info:'Оң жақ шкивтен генератор шкивіне айналуды жеткізеді. Белдік пен мойынтіректерде шығын болады.',group:belt,explode:[0,.4,.8],anchor:[2.15,.1,.9]});
  const gen=new THREE.Group();gen.position.set(3.4,-.42,.12);cyl(gen,.1,0,0,.55,1.35,silver,'x');for(let i=0;i<9;i++){const x=-.46+i*.12;cyl(gen,x,0,0,.57,.025,edge,'x')}const genPulley=new THREE.Group();genPulley.position.set(-.71,0,0);cyl(genPulley,0,0,0,.28,.15,steel,'x');tor(genPulley,-.09,0,0,.26,.045,rubber,'x');for(let a=0;a<6;a++){const t=a*Math.PI/3;line(genPulley,[[-.18,0,0],[-.18,Math.cos(t)*.2,Math.sin(t)*.2]],.025,edge)}gen.add(genPulley);cyl(gen,.83,0,0,.39,.075,edge,'x');for(let a=0;a<12;a++){let t=a*Math.PI/6;box(gen,.75,Math.sin(t)*.28,Math.cos(t)*.28,.05,.075,.14,edge)}box(gen,.05,-.68,0,1.25,.18,.65,dark);for(const x of [-.4,.5])box(gen,x,-.82,0,.34,.15,.56,steel);addPart({name:'Генератор',info:'Корпусы қозғалмайды; шкиві өзінің білігімен бір осьте айналып, механикалық жұмысты электр энергиясына айналдыруға мүмкіндік береді.',group:gen,explode:[.8,.38,.3],anchor:[.1,.7,.1]});

  const bulb=new THREE.Group();bulb.position.set(7.5,-.4,.25);cyl(bulb,0,-.42,0,.18,.39,edge);cyl(bulb,0,-.21,0,.14,.12,steel);const globe=new THREE.Mesh(new THREE.SphereGeometry(.32,24,16),glass);globe.material=glass.clone();globe.material.emissiveIntensity=0;globe.scale.y=1.2;globe.position.y=.26;bulb.add(globe);const halo=new THREE.Mesh(new THREE.SphereGeometry(.43,24,16),new THREE.MeshBasicMaterial({color:0xffc66b,transparent:true,opacity:0,depthWrite:false,side:THREE.BackSide}));halo.scale.y=1.2;halo.position.y=.26;bulb.add(halo);line(bulb,[[-.09,.1,.1],[0,.3,.13],[.09,.1,.1]],.015,copper);const light=new THREE.PointLight(0xffbd69,0,2.3);light.position.set(0,.28,.18);bulb.add(light);bulb.userData.light=light;bulb.userData.globe=globe;bulb.userData.halo=halo;addPart({name:'Шам',info:'Анимация жүріп тұрған кезде аккумулятордан энергия алып жанады; бастапқы көріністе сөнулі.',group:bulb,explode:[.6,.55,.3],anchor:[0,.66,.1]});
  this._moving={shaftRotor,fly,crank,right,genPulley,springs,bulb,beltMarkers};
 },
 stages:[
  {part:'Сол жақтағы жетек шкиві',text:'1. Бастапқы айналу сол жақ шкивке сырттан беріледі.'},
  {part:'Иінді білік пен үш иін',text:'2. Шкив иінді білікті айналдырады. Жоғарғы және төменгі серіппелер кезектесіп қысылып, созылады.'},
  {part:'Белдік',text:'3. Оң жақ шкив белдікті қозғайды, белдік генератор шкивін айналдырады. Көрсетілген жылдамдықтар оқу анимациясы үшін шартты.'},
  {part:'Генератор',text:'4. Генератор механикалық жұмысты электр энергиясына түрлендіреді. Жылу, үйкеліс және белдік шығыны салдарынан алынған энергия кіріс жұмысынан аз болады.'},
  {part:'Аккумулятор',text:'5. Электр энергиясы аккумуляторға беріледі. Сым жолы схемалық көрсетілген.',path:[[4.1,-.4,.5],[4.5,-.6,.5],[4.77,-.87,.5]],pathColor:0xf25b4e},
  {part:'Шам',text:'6. Жұмыс анимациясында аккумулятор шамды жағады. Модельді бастапқы көрініске қайтарғанда шам сөнеді. Аккумуляторды қайта зарядтау үшін сыртқы механикалық энергия керек.',path:[[5.7,-.87,.55],[6.5,-.65,.55],[7.5,-.48,.55]],pathColor:0xffbf63}
 ],
 animateStage({time,step}) {const m=this._moving;if(!m)return;const on=step>=0,phase=time*1.65;for(const o of [m.shaftRotor,m.fly,m.crank,m.right,m.genPulley])o.rotation.x=on?phase:0;for(let i=0;i<4;i++){const spring=m.springs[i],data=spring.userData,side=i%2?-1:1,delta=on?side*(.15*(Math.cos(phase)-1)-.34*Math.sin(phase)):0;data.moving.position.y=(data.top?-.55:.55)+delta;data.coil.position.y=delta/2;data.coil.scale.y=1+(data.top?-1:1)*delta/1.1}for(const b of m.beltMarkers){b.marker.visible=on;if(on){const p=(b.index/3+(b.reverse?-1:1)*time*.18%1+1)%1;b.marker.position.copy(b.curve.getPoint(p))}}if(!on)this._powerStart=null;else if(this._powerStart==null)this._powerStart=time;const lit=on&&time-this._powerStart>=4;m.bulb.userData.light.intensity=lit?2.5:0;m.bulb.userData.globe.material.emissiveIntensity=lit?2.3:0;m.bulb.userData.halo.material.opacity=lit?.2:0;}

const $ = id => document.getElementById(id);
$('title').textContent = MODEL.title;
$('explanation').textContent = MODEL.explanation || '';

document.title = MODEL.title + ' · 3D Model Lab';

const stage=$('stage'),scene=new THREE.Scene(),objectRoot=new THREE.Group();scene.add(objectRoot);
const camera=new THREE.PerspectiveCamera(42,1,.01,1000);

const fill=new THREE.DirectionalLight(0x91bcd1,1.4);fill.position.set(-7,3,-5);scene.add(fill);

const parts=[],meshToPart=new WeakMap(),tags=[];
function addPart({name,info,group,explode=[0,0,0],anchor=null}){
 if(!name||!group?.isGroup)throw new Error('Every named part needs a THREE.Group');
 objectRoot.add(group);
 const meshes=[];
 group.traverse(node=>{if(node.isMesh){meshToPart.set(node,group);meshes.push(node)}});
 if(!meshes.length)throw new Error('A selectable part needs visible geometry: '+name);

 parts.push(group);
 const tag=document.createElement('span');tag.className='tag';tag.textContent=name;$('labels').append(tag);
 const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('stroke','#afcad7');line.setAttribute('stroke-width','1');$('lines').append(line);
 tags.push({group,tag,line});return group;

MODEL.build({THREE,scene,objectRoot,addPart});
if(!parts.length)throw new Error('The model has no selectable parts');
if(!Array.isArray(MODEL.stages)||!MODEL.stages.length)throw new Error('How it works needs object-specific stages');
for(const s of MODEL.stages)if(!parts.some(p=>p.userData.model.name===s.part)||!s.text)throw new Error('Invalid explanation stage: '+s.part);
scene.updateMatrixWorld(true);
for(const group of parts){
 const d=group.userData.model;if(d.anchor)continue;
 const b=new THREE.Box3().setFromObject(group),world=b.getCenter(new THREE.Vector3());world.y=b.max.y;
 d.anchor=group.worldToLocal(world);
}

const bounds=new THREE.Box3().setFromObject(objectRoot);
const center=bounds.getCenter(new THREE.Vector3());objectRoot.position.sub(center);
const sphere=bounds.getBoundingSphere(new THREE.Sphere());const radius=Math.max(.55,sphere.radius);
const flowMarkers=MODEL.stages.map(s=>{
 if(!s.path)return null;
 if(!Array.isArray(s.path)||s.path.length<2||s.path.some(p=>!Array.isArray(p)||p.length!==3))throw new Error('Invalid demonstration path: '+s.part);
 const curve=new THREE.CatmullRomCurve3(s.path.map(p=>new THREE.Vector3(...p)));
 const color=s.pathColor||0xffc86c;
 const route=new THREE.Mesh(new THREE.TubeGeometry(curve,48,radius*.008,8,false),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7}));
 const marker=new THREE.Mesh(new THREE.SphereGeometry(radius*.05,16,10),new THREE.MeshBasicMaterial({color}));
 route.visible=false;marker.visible=false;objectRoot.add(route,marker);
 return {curve,route,marker};
});
const initialDirection=new THREE.Vector3(1.25,.85,1.65).normalize();
function fit(){
 const narrow=Math.min(1,camera.aspect),half=Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*narrow);
 const distance=radius/Math.max(.12,Math.sin(half))*1.16;
 camera.position.copy(initialDirection).multiplyScalar(distance);orbit.target.set(0,0,0);
 orbit.minDistance=radius*.3;orbit.maxDistance=radius*10;orbit.update();
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
new ResizeObserver(resize).observe(stage);resize();fit();

let selected=null,disassembled=false,labelsOn=false,step=-1,down=null;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',event=>{down={x:event.clientX,y:event.clientY}});
renderer.domElement.addEventListener('pointerup',event=>{
 if(!down)return;
 const moved=Math.hypot(event.clientX-down.x,event.clientY-down.y);down=null;
 if(moved>7)return;
 const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);
 raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(parts,true).find(h=>meshToPart.has(h.object));
 if(hit)select(meshToPart.get(hit.object));
});
function select(group){
 if(selected)selected.traverse(n=>{if(n.isMesh&&n.userData.originalMaterial){n.material.dispose();n.material=n.userData.originalMaterial;delete n.userData.originalMaterial}});
 selected=group;if(!group)return;
 group.traverse(n=>{if(n.isMesh&&n.material.emissive){n.userData.originalMaterial=n.material;n.material=n.material.clone();n.material.emissive.add(new THREE.Color(0x233b4c))}});
 $('partName').textContent=group.userData.model.name;$('partInfo').textContent=group.userData.model.info;
}
function press(id,on){$(id).setAttribute('aria-pressed',String(on))}
$('explode').onclick=()=>{disassembled=!disassembled;press('explode',disassembled);$('explode').textContent=disassembled?'Жинау':'Бөлшектеу'};
$('toggleLabels').onclick=()=>{labelsOn=!labelsOn;press('toggleLabels',labelsOn);$('toggleLabels').textContent=labelsOn?'Атауларды жасыру':'Атауларды көрсету'};
$('works').onclick=()=>{
 const stages=MODEL.stages;
 step=(step+1)%stages.length;const s=stages[step],group=parts.find(p=>p.userData.model.name===s.part);
 flowMarkers.forEach((f,i)=>{if(f)f.route.visible=f.marker.visible=i===step});
 if(group)select(group);$('partName').textContent=`Жұмыс істеу принципі · ${step+1}/${stages.length}`;$('partInfo').textContent=s.text;
};
$('reset').onclick=()=>{step=-1;flowMarkers.forEach(f=>{if(f)f.route.visible=f.marker.visible=false});if(typeof MODEL.animateStage==='function')MODEL.animateStage({time:0,step:-1,parts,THREE});disassembled=false;labelsOn=false;press('explode',false);press('toggleLabels',false);$('explode').textContent='Бөлшектеу';$('toggleLabels').textContent='Атауларды көрсету';select(null);$('partName').textContent='Бөлшекті таңдаңыз';$('partInfo').textContent='Модельдің бөлшегін басыңыз. Тінтуірмен айналдырып, дөңгелегімен жақындатыңыз.';fit()};

const used=[],clip=new THREE.Vector3();
function updateLabels(){
 const width=stage.clientWidth,height=stage.clientHeight;used.length=0;
 scene.updateMatrixWorld(true);
 for(const {group,tag,line} of tags){
  tag.style.display='none';line.style.display='none';if(!labelsOn)continue;
  const p=group.localToWorld(group.userData.model.anchor.clone());clip.copy(p).project(camera);
  if(clip.z<0||clip.z>1||Math.abs(clip.x)>1||Math.abs(clip.y)>1)continue;
  const toward=p.clone().sub(camera.position),distance=toward.length();
  raycaster.set(camera.position,toward.normalize());
  const blocker=raycaster.intersectObjects(parts,true).find(h=>meshToPart.has(h.object)&&meshToPart.get(h.object)!==group);
  if(blocker&&blocker.distance<distance-.08)continue;
  const x=(clip.x+1)*width/2,y=(1-clip.y)*height/2;
  tag.style.display='block';tag.style.visibility='hidden';const tw=tag.offsetWidth,th=tag.offsetHeight;
  const positions=[[x-tw/2,y-th-13],[x+12,y-th/2],[x-tw-12,y-th/2],[x-tw/2,y+12]];
  const ok=positions.find(([px,py])=>px>4&&py>4&&px+tw<width-4&&py+th<height-4&&used.every(([ax,ay,aw,ah])=>px+tw+5<ax||ax+aw+5<px||py+th+5<ay||ay+ah+5<py));
  if(!ok){tag.style.display='none';continue}
  tag.style.left=ok[0]+'px';tag.style.top=ok[1]+'px';tag.style.visibility='visible';
  used.push([ok[0],ok[1],tw,th]);line.style.display='block';
  line.setAttribute('x1',x);line.setAttribute('y1',y);line.setAttribute('x2',ok[0]+tw/2);line.setAttribute('y2',ok[1]+th/2);
 }
}
let clock=0;
function frame(t){
 requestAnimationFrame(frame);const dt=Math.min(.05,(t-clock)/1000||0);clock=t;
 for(const group of parts){const d=group.userData.model,target=d.base.clone().addScaledVector(d.explode,disassembled?1:0);group.position.lerp(target,Math.min(1,dt*9))}
 if(step>=0&&typeof MODEL.animateStage==='function')MODEL.animateStage({time:t/1000,step,parts,THREE});
 if(step>=0&&flowMarkers[step])flowMarkers[step].marker.position.copy(flowMarkers[step].curve.getPointAt((t*.00035)%1));
 orbit.update();updateLabels();renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
